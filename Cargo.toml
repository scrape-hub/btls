[workspace]
members = [
    "btls",
    "btls-sys",
    "tokio-btls",
    "compio-btls",
    "quinn-btls",
]
default-members = [
    "btls",
    "btls-sys",
    "tokio-btls",
]
resolver = "2"

[workspace.package]
version = "0.5.5"
repository = "https://github.com/0x676e67/btls"
edition = "2021"
rust-version = "1.85"

# quinn-btls implements `crypto::Session::poll_handshake` of the scrape-hub/quinn fork.
[patch.crates-io]
quinn = { git = "https://github.com/scrape-hub/quinn", tag = "koon-1.0.0" }
quinn-proto = { git = "https://github.com/scrape-hub/quinn", tag = "koon-1.0.0" }
quinn-udp = { git = "https://github.com/scrape-hub/quinn", tag = "koon-1.0.0" }

[workspace.metadata.release]
pre-release-commit-message = "Release {{version}}"
shared-version = true
tag-prefix = ""
publish = false

[workspace.dependencies]
btls-sys = { version = "0.5.5", path = "./btls-sys" }
btls = { version = "0.5.5", path = "./btls" }
tokio-btls = { version = "0.5.5", path = "./tokio-btls" }

bindgen = { version = "0.72.0", default-features = false, features = ["runtime"] }
bitflags = "2.9"
brotli = "8.0"
cmake = "0.1.57"
fs_extra = "1.3.0"
fslock = "0.2"
foreign-types = "0.5"
libc = "0.2"
hex = "0.4"
futures = "0.3"
tokio = "1"
compio = "0.18.0"
anyhow = "1"
openssl-macros = "0.1.1"
